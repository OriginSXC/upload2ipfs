name: Discover IPFS Gateways

on:
  workflow_dispatch:
  schedule:
    - cron: "5 1 * * *" # 每天 01:05 UTC 运行

permissions:
  contents: write

concurrency:
  group: ipfs-gateway-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests==2.32.3

      - name: Discover and merge gateway list
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          OUTPUT = Path("gateways.txt")
          API_SUFFIX = "/api/v0/cat?arg="
          IPFS_SUFFIX = "/ipfs/"
          USER_AGENT = "upload2ipfs-gateway-discovery"
          SOURCES = [
              "https://raw.githubusercontent.com/ipfs/public-gateway-checker/main/gateways.json",
              "https://ipfs.github.io/public-gateway-checker/gateways.json",
              "https://raw.githubusercontent.com/ipfs/awesome-ipfs/main/README.md",
              "https://docs.ipfs.tech/concepts/ipfs-gateway/",
          ]

          def normalize_gateway(url: str):
              u = url.strip().strip("'\"`),.;")
              if not u.startswith(("http://", "https://")):
                  return None
              parsed = urlparse(u)
              if not parsed.netloc:
                  return None

              api_idx = u.find(API_SUFFIX)
              if api_idx != -1:
                  return u[: api_idx + len(API_SUFFIX)]

              ipfs_idx = u.find(IPFS_SUFFIX)
              if ipfs_idx != -1:
                  return u[: ipfs_idx + len(IPFS_SUFFIX)]

              if u.endswith("/ipfs"):
                  return f"{u}/"

              if parsed.path in ("", "/"):
                  return f"{parsed.scheme}://{parsed.netloc}/ipfs/"

              return None

          def extract_gateways(text: str):
              found = set()
              for raw in re.findall(r"https?://[^\s\"'`<>\\]+", text):
                  normalized = normalize_gateway(raw)
                  if normalized:
                      found.add(normalized)
              return found

          existing = set()
          if OUTPUT.exists():
              for line in OUTPUT.read_text(encoding="utf-8").splitlines():
                  normalized = normalize_gateway(line)
                  if normalized:
                      existing.add(normalized)

          discovered = set()
          session = requests.Session()
          session.headers.update({"User-Agent": USER_AGENT})
          for source in SOURCES:
              try:
                  resp = session.get(source, timeout=20)
                  if resp.ok:
                      discovered.update(extract_gateways(resp.text))
                  else:
                      print(f"[WARN] {source} -> HTTP {resp.status_code}")
              except Exception as exc:
                  print(f"[WARN] {source} -> {type(exc).__name__}: {exc}")

          merged = sorted(existing | discovered)
          OUTPUT.write_text("\n".join(merged) + ("\n" if merged else ""), encoding="utf-8")
          print(f"existing={len(existing)} discovered={len(discovered)} merged={len(merged)}")
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gateways.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: discover and merge IPFS gateways ($(date -u +'%Y-%m-%d'))"
          BRANCH="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          git pull --rebase origin "${BRANCH}"
          git push origin HEAD:"${BRANCH}"
